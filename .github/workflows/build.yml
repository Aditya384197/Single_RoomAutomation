name: Build ESP32 Room Automation Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          # FIX: --git-url installs are disabled by default (security default
          # in recent arduino-cli). Must explicitly opt in, or the AsyncTCP/
          # ESPAsyncWebServer git-based installs below fail with exit code 1.
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install required libraries
        run: |
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP.git
          arduino-cli lib install --git-url https://github.com/ESP32Async/ESPAsyncWebServer.git

      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --output-dir build \
            Single_RoomAutomation.ino

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-automation-firmware
          path: build/*.bin
          retention-days: 30
